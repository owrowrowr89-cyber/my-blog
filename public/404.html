<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없습니다 - K잇핏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	background: #faf9f7;
	color: #333;
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
	text-align: center;
	padding: 2em;
}
.card {
	background: white;
	border-radius: 20px;
	padding: 3em 2em;
	box-shadow: 0 4px 20px rgba(0,0,0,6%);
	max-width: 480px;
}
h1 { font-size: 3em; color: #006241; margin-bottom: 0.2em; }
h2 { font-size: 1.2em; color: #333; margin-bottom: 0.8em; }
p { color: #777; line-height: 1.6; margin-bottom: 1.5em; font-size: 0.95em; }
.btn {
	display: inline-block;
	padding: 0.8em 2em;
	background: #006241;
	color: white;
	border-radius: 50px;
	text-decoration: none;
	font-weight: 600;
	font-size: 0.95em;
}
.btn:hover { background: #004831; }
.mascot { font-size: 4em; margin-bottom: 0.3em; }
</style>
</head>
<body>
<div class="card">
	<div class="mascot">🪄</div>
	<h1>404</h1>
	<h2>페이지를 찾을 수 없습니다</h2>
	<p>주소가 변경되었거나 페이지가 이동되었을 수 있습니다.<br>홈으로 이동해서 원하는 글을 찾아보세요!</p>
	<a href="/my-blog/" class="btn">🏠 K잇핏 홈으로</a>
</div>
</body>
</html>
